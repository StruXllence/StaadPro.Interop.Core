name: Build and Test Core
on:
  push:
    branches: [ staadpro-interop-core, main ]
  pull_request:
    branches: [ staadpro-interop-core, main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.3xx'
      - name: Build Foundation
        run: dotnet build StaadPro.Interop.Core.sln -c Release
      - name: Test Foundation
        run: dotnet test StaadPro.Interop.Core.sln -c Release --no-build
      - name: Pack Preview
        run: dotnet pack src/StaadPro.Interop.Core/StaadPro.Interop.Core.csproj -c Release --no-build -p:PackageVersion=1.0.0-preview.ci.${{ github.run_number }} -o artifacts/package
      - name: Verify Installed Package
        shell: pwsh
        run: ./eng/Verify-CorePackage.ps1 -PackagePath artifacts/package/StaadPro.Interop.Core.1.0.0-preview.ci.${{ github.run_number }}.nupkg
